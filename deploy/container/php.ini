expose_php=Off
display_errors=Off
log_errors=On
zend.exception_ignore_args=On
memory_limit=512M
upload_max_filesize=64M
post_max_size=80M
max_file_uploads=10
date.timezone=Europe/Moscow
session.save_path=/opt/app/runtime/sessions
upload_tmp_dir=/opt/app/runtime/upload-tmp
sys_temp_dir=/opt/app/runtime/tmp

