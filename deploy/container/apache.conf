<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /opt/app/public
    DirectoryIndex index.php
    <Directory /opt/app/public>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    # HTTPS is terminated by the trusted host proxy on the loopback binding.
    SetEnv HTTPS on
    ErrorLog /proc/self/fd/2
    LogFormat "%t %>s %b" app_safe
    CustomLog /proc/self/fd/1 app_safe
</VirtualHost>

