services:
  app:
    image: ${APP_IMAGE:?An immutable image ID is required}
    restart: unless-stopped
    environment:
      APP_STAND: ${STAND:?}
      APP_DB_CONFIG_FILE: /opt/app/.local/database.php
      APP_ARTIFACTS_ROOT: /opt/app/artifacts
    extra_hosts:
      - "smtp.spaceweb.ru:77.222.41.51"
      - "platform-api2.max.ru:155.212.204.149"
    volumes:
      - ./data/local:/opt/app/.local:ro
      - ./data/private:/opt/app/private
      - ./data/documents:/opt/app/.local/documents
      - ./data/uploads:/opt/app/uploads
      - ./data/storage:/opt/app/storage
      - ./data/artifacts:/opt/app/artifacts
      - ./data/runtime:/opt/app/runtime
      - ./state/deployment.json:/opt/app/deployment.json:ro
    networks:
      backend:
        ipv4_address: ${APP_IP:?}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "/opt/app/bin/server-diagnostics.php", "--check"]
      interval: 15s
      timeout: 10s
      retries: 4
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  db:
    image: mysql:8.4.9@sha256:c36050afdca850f23cef85703f84c7531a5ae155a11b5ee1c60acb09937c4084
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?}
      MYSQL_USER: ${DB_USER:?}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes:
      - ./data/mysql:/var/lib/mysql
    command: ["--innodb-buffer-pool-size=256M", "--max-connections=60"]
    networks:
      backend:
        ipv4_address: ${DB_IP:?}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$(cat /run/secrets/db_root_password) mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  backend:
    internal: ${NETWORK_INTERNAL:-false}
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:?}
secrets:
  db_password:
    file: ./secrets/db-password
  db_root_password:
    file: ./secrets/db-root-password

